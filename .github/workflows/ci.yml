name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integration-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/integration-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  repository-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          bash scripts/bootstrap/check-repo.sh

      - name: Validate KB samples
        run: |
          python scripts/validation/validate-kb-template.py
